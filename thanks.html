<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order received — Inkora Collective</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <div class="kicker">Thank you</div>
    <h1>Order received.</h1>
    <div id="box" class="card-form" style="max-width:520px"></div>
  </div>
  <script src="site.js"></script>
  <script>
    Inkora.nav("shop");
    var o = null;
    try { o = JSON.parse(localStorage.getItem("inkora_last_order") || "null"); } catch(e) {}
    var box = document.getElementById("box");
    if (!o) { box.innerHTML = "<p>No order on this phone.</p>"; }
    else {
      var payName = { cod:"Cash on delivery", bkash:"bKash", nagad:"Nagad" }[o.pay] || o.pay;
      box.innerHTML =
        "<p><b>Order "+o.id+"</b></p>" +
        "<p class='note'>"+o.name+" · "+o.phone+"</p>" +
        "<p class='note'>"+o.address+"</p>" +
        o.items.map(function(i){ return "<p>"+i.qty+" × "+i.name+" — "+Inkora.money(i.line)+"</p>"; }).join("") +
        "<p>Delivery ৳140</p><p><b>Total "+Inkora.money(o.total)+"</b> · "+payName+(o.trx? " · Trx "+o.trx:"")+"</p>" +
        "<p class='note'>We will call or message this number to confirm. WhatsApp লাগবে না — চাইলে নিজে পাঠাতে পারো।</p>" +
        '<p style="margin-top:16px"><a class="btn-dark" href="index.html">Back to shop</a></p>';
    }
  </script>
