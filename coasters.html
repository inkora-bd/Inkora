<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coasters &amp; Table — Inkora Collective</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <div class="crumb"><a href="index.html">Home</a> / <a href="shop.html">Shop All</a> / Coasters</div>
    <div class="kicker">Coasters &amp; Table</div>
    <h1>Flora Doily</h1>
    <p class="lead">One scalloped pattern. Nine colourways. Tap a piece for size, yarn, care, and add to bag — not WhatsApp.</p>
    <div class="plist" id="grid" style="margin-top:28px"></div>
  </div>
  <footer class="site-foot">
    <div><h4>Shop</h4><a href="shop.html">Shop All</a><a href="custom.html">Custom</a></div>
    <div><h4>Help</h4><a href="terms.html">Terms</a><a href="cart.html">Bag</a></div>
    <div class="copy">© Inkora Collective</div>
  </footer>
  <script src="products.js"></script>
  <script src="site.js"></script>
  <script>
    Inkora.nav("shop");
    document.getElementById("grid").innerHTML = INKORA_PRODUCTS.map(function(p){
      return '<a class="pcard" href="product.html?id='+p.slug+'">' +
        '<img src="'+p.img+'" alt="'+p.name+'">' +
        '<h3>'+p.name+'</h3>' +
        '<div class="sm">'+p.palette+'</div>' +
        '<div class="pr">'+Inkora.money(p.price)+'</div></a>';
    }).join("");
  </script>
</body>
</html>
