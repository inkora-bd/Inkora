<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bag — Inkora Collective</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <div class="kicker">Your bag</div>
    <h1>Bag</h1>
    <div id="box"></div>
  </div>
  <footer class="site-foot">
    <div><h4>Shop</h4><a href="shop.html">Shop All</a><a href="coasters.html">Coasters</a></div>
    <div><h4>Help</h4><a href="terms.html">Terms</a></div>
    <div class="copy">© Inkora Collective</div>
  </footer>
  <script src="products.js"></script>
  <script src="site.js"></script>
  <script>
    Inkora.nav("shop");
    var box = document.getElementById("box");
    function draw() {
      var lines = Inkora.cartLines();
      if (!lines.length) {
        box.innerHTML = '<p>Bag is empty.</p><p style="margin-top:14px"><a class="btn-dark" href="coasters.html">Shop coasters</a></p>';
        return;
      }
      var rows = lines.map(function(l){
        return '<tr>' +
          '<td><a href="product.html?id='+l.product.slug+'"><img src="'+l.product.img+'" alt=""></a></td>' +
          '<td><a href="product.html?id='+l.product.slug+'">'+l.product.name+'</a><div class="note">'+l.product.palette+'</div></td>' +
          '<td><div class="qty"><button data-s="'+l.product.slug+'" data-d="-1">−</button><span>'+l.qty+'</span><button data-s="'+l.product.slug+'" data-d="1">+</button></div></td>' +
          '<td>'+Inkora.money(l.line)+'</td>' +
        '</tr>';
      }).join("");
      var sub = Inkora.subtotal();
      box.innerHTML =
        '<table class="cart-table"><thead><tr><th></th><th>Piece</th><th>Qty</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table>' +
        '<div class="cart-sum">' +
          '<p><span>Subtotal</span><span>'+Inkora.money(sub)+'</span></p>' +
          '<p><span>Delivery</span><span>৳140</span></p>' +
          '<p><span>To pay</span><b>'+Inkora.money(sub+Inkora.SHIP)+'</b></p>' +
          '<a class="btn-dark" href="checkout.html" style="display:block;text-align:center;margin-top:12px">Checkout</a>' +
        '</div>';
      document.querySelectorAll(".qty button").forEach(function(b){
        b.onclick = function(){
          var slug = b.getAttribute("data-s");
          var d = parseInt(b.getAttribute("data-d"),10);
          var cur = Inkora.cart().find(function(x){ return x.slug===slug; });
          Inkora.setQty(slug, (cur ? cur.qty : 1) + d);
          Inkora.nav("shop");
          draw();
        };
      });
    }
    draw();
  </script>

</html>
